<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="app.css">
</head><body>

<div class="statusbar">
  <div class="sb-time">{{TIME}}
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18.63 13A17.9 17.9 0 0 1 18 8a6 6 0 0 0-9.33-5"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
  </div>
  <div class="sb-right">
    <svg width="19" height="13" viewBox="0 0 19 13"><rect x="0" y="8" width="3.4" height="5" rx="1" fill="#262521"/><rect x="5" y="5.5" width="3.4" height="7.5" rx="1" fill="#262521"/><rect x="10" y="3" width="3.4" height="10" rx="1" fill="#d4cfc2"/><rect x="15" y="0" width="3.4" height="13" rx="1" fill="#d4cfc2"/></svg>
    <svg width="19" height="14" viewBox="0 0 24 18" fill="none" stroke="#262521" stroke-width="2.6" stroke-linecap="round"><path d="M2 6.5a15 15 0 0 1 20 0"/><path d="M5.5 10.5a10 10 0 0 1 13 0"/><path d="M9 14.2a5 5 0 0 1 6 0"/><circle cx="12" cy="17" r="1.4" fill="#262521" stroke="none"/></svg>
    <svg width="30" height="15" viewBox="0 0 30 15"><rect x="0.5" y="0.5" width="25" height="14" rx="4.5" fill="#262521"/><rect x="1.8" y="1.8" width="13" height="11.4" rx="3.4" fill="#262521"/><text x="13" y="11.2" font-family="Inter" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">52</text><rect x="27" y="4.6" width="2.6" height="5.8" rx="1.3" fill="#c9c4b6"/></svg>
  </div>
</div>

<div class="ma-nav">
  <div class="ma-back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Capture
  </div>
  <div class="ma-title">Meal Analysis</div>
</div>

<div class="ma-photo"><img src="{{IMG}}"></div>

<div class="ma-green">
  <div class="ma-cal">{{CAL}}</div>
  <div class="ma-cal-label">calories</div>
  <div class="ma-macros">
    <div class="ma-macro"><div class="v">{{P}}g</div><div class="l">Protein</div></div>
    <div class="ma-macro"><div class="v">{{C}}g</div><div class="l">Carbs</div></div>
    <div class="ma-macro"><div class="v">{{F}}g</div><div class="l">Fat</div></div>
  </div>
  <div class="ma-conf">{{CONF}}</div>
</div>

<div class="card ma-breakdown">
  <div class="bd-label">Breakdown</div>
  <div class="bd-row">
    <div>
      <div class="bd-name">{{NAME}}</div>
      <div class="bd-qty">{{QTY}}</div>
    </div>
    <div class="bd-cal" style="padding-top:{{CALPAD}}px">{{CAL}} cal</div>
  </div>
</div>

</body></html>
