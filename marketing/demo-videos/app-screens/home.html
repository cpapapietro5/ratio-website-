<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="app.css">
</head><body>

<div class="statusbar">
  <div class="sb-time">6:23
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#262521" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18.63 13A17.9 17.9 0 0 1 18 8a6 6 0 0 0-9.33-5"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
  </div>
  <div class="sb-right">
    <svg width="19" height="13" viewBox="0 0 19 13"><rect x="0" y="8" width="3.4" height="5" rx="1" fill="#262521"/><rect x="5" y="5.5" width="3.4" height="7.5" rx="1" fill="#262521"/><rect x="10" y="3" width="3.4" height="10" rx="1" fill="#d4cfc2"/><rect x="15" y="0" width="3.4" height="13" rx="1" fill="#d4cfc2"/></svg>
    <svg width="19" height="14" viewBox="0 0 24 18" fill="none" stroke="#262521" stroke-width="2.6" stroke-linecap="round"><path d="M2 6.5a15 15 0 0 1 20 0"/><path d="M5.5 10.5a10 10 0 0 1 13 0"/><path d="M9 14.2a5 5 0 0 1 6 0"/><circle cx="12" cy="17" r="1.4" fill="#262521" stroke="none"/></svg>
    <svg width="30" height="15" viewBox="0 0 30 15"><rect x="0.5" y="0.5" width="25" height="14" rx="4.5" fill="#262521"/><text x="13" y="11.2" font-family="Inter" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">52</text><rect x="27" y="4.6" width="2.6" height="5.8" rx="1.3" fill="#c9c4b6"/></svg>
  </div>
</div>

<div class="home">
  <div class="logo">Rati<span class="omac">o</span></div>
  <div class="logo-bar"></div>

  <div class="week">
    <div class="week-head">
      <span class="chev">‹</span>
      <span class="week-title">This week</span>
      <span class="chev dim">›</span>
    </div>
    <div class="days">
      <div class="day"><div class="dl">M</div><div class="dn">17</div><div class="dot"></div></div>
      <div class="day"><div class="dl">T</div><div class="dn">18</div></div>
      <div class="day"><div class="dl">W</div><div class="dn">19</div></div>
      <div class="day today-sel"><div class="pill"><div class="dl">T</div><div class="dn">20</div></div></div>
      <div class="day"><div class="dl">F</div><div class="dn">21</div></div>
      <div class="day"><div class="dl">S</div><div class="dn">22</div></div>
      <div class="day"><div class="dl">S</div><div class="dn">23</div></div>
    </div>
  </div>

  <div class="card today-card">
    <div class="tc-head"><div class="tc-title">Today</div><div class="tc-cal">0 / 3150 cal</div></div>
    <div class="tc-bar"></div>
    <div class="tc-burn">
      <div class="tc-burn-l">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2f5243" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-4 6-4 11a4 4 0 0 0 8 0c0-2-1-3.5-2-5-2 2-2 3-2 3"/></svg>
        Cals Burned
      </div>
      <div class="chip">+ Add</div>
    </div>
    <div class="rings">
      <div class="ring-col">
        <div class="ring-wrap">
          <svg width="96" height="96"><circle cx="48" cy="48" r="41" fill="none" stroke="#dce8de" stroke-width="9"/></svg>
          <div class="ring-center">0g</div>
        </div>
        <div class="ring-name">Protein</div><div class="ring-goal">/190g</div>
      </div>
      <div class="ring-col">
        <div class="ring-wrap">
          <svg width="96" height="96"><circle cx="48" cy="48" r="41" fill="none" stroke="#f3ddce" stroke-width="9"/></svg>
          <div class="ring-center">0g</div>
        </div>
        <div class="ring-name">Carbs</div><div class="ring-goal">/324g</div>
      </div>
      <div class="ring-col">
        <div class="ring-wrap">
          <svg width="96" height="96"><circle cx="48" cy="48" r="41" fill="none" stroke="#dbe6ec" stroke-width="9"/></svg>
          <div class="ring-center">0g</div>
        </div>
        <div class="ring-name">Fat</div><div class="ring-goal">/122g</div>
      </div>
    </div>
  </div>

  <div class="card streak-card">
    <div class="st-head">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5243" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-4 6-4 11a4 4 0 0 0 8 0c0-2-1-3.5-2-5-2 2-2 3-2 3"/></svg>
      <span class="st-num">0</span><span class="st-lbl">day streak</span>
    </div>
    <div class="st-dots">
      <div class="st-col"><div class="st-dot on"></div><div class="st-day">Mo</div></div>
      <div class="st-col"><div class="st-dot"></div><div class="st-day">Tu</div></div>
      <div class="st-col"><div class="st-dot"></div><div class="st-day">We</div></div>
      <div class="st-col"><div class="st-dot"></div><div class="st-day">Th</div></div>
      <div class="st-col"><div class="st-dot"></div><div class="st-day">Fr</div></div>
      <div class="st-col"><div class="st-dot"></div><div class="st-day">Sa</div></div>
      <div class="st-col"><div class="st-dot"></div><div class="st-day">Su</div></div>
    </div>
  </div>

  <div class="card water-card">
    <div class="w-head">
      <div class="w-title">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2f5243" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7 6.5 10a6.8 6.8 0 1 0 11 0Z"/></svg>
        Water
      </div>
      <div class="w-amt">0 / 100 oz
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2f5243" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      </div>
    </div>
    <div class="w-bar"></div>
    <div class="w-btn">+ Log Water</div>
    <div class="w-src">Where this goal comes from (2) <span class="car">▼</span></div>
  </div>

  <div class="card meals-card">
    <div class="m-title">Today's Meals</div>
    <div class="chip" style="background:#cdd9c8;">+ Log</div>
  </div>
</div>

<div class="fab">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f6f3ea" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
</div>

<div class="tabbar">
  <div class="tab active">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20Z"/><path d="M9 21.5v-8h6v8"/></svg>
    <div class="t-lbl">Home</div>
  </div>
  <div class="tab">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="18" y1="20" x2="18" y2="11"/></svg>
    <div class="t-lbl">Progress</div>
  </div>
  <div class="tab">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
    <div class="t-lbl">History</div>
  </div>
  <div class="tab">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg>
    <div class="t-lbl">Profile</div>
  </div>
</div>

</body></html>
